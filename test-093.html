const RARITY=['Adware','Trojan','Worm','Rootkit','Zero-day'];function checkBadges(){return;let changed=false;for(const b of BADGES){if(profile.unlocked[b.id])continue;const v=b.check(completed());if(v.cur>=v.max){profile.unlocked[b.id]=new Date().toISOString();changed=true;notify('✦ '+b.name)}}if(changed)saveLocal()}
function brand(){return logo()+'<span>KAIROKIT</span>'}function statusText(s){const i=STATUS.indexOf(s);return i<0?t('none'):t(STATUS_KEYS[i])}function fmtFormat(s){return ({TV:'Сериал',MOVIE:'Фильм',SPECIAL:'Спешл',ONA:'ONA',OVA:'OVA',TV_SHORT:'Короткий сериал',MUSIC:'Клип'}[s]||s||'—')}
function renderAuth(message=''){document.documentElement.lang=lang;$('authBrand').innerHTML=brand();$('welcomeFeatures').innerHTML=[['КОЛЛЕКЦИЯ','Статусы, эпизоды и оценки'],['БИБЛИОТЕКА','Каталог AniList и Shikimori'],['ЗНАЧКИ','Награды за просмотр'],['ОБЛАКО','Синхронизация между устройствами']].map(x=>`<div class="stat"><b style="font-size:15px">${x[0]}</b><span class="small">${x[1]}</span></div>`).join('');$('stepsTitle').textContent=lang==='ru'?'ТРИ ШАГА':'THREE STEPS';$('welcomeSteps').innerHTML=['Найди аниме в библиотеке','Отмечай просмотр и оценки','Собирай коллекцию и значки'].map((s,i)=>`<div class="step"><span style="color:var(--purple)">0${i+1}</span> · ${s}</div>`).join('');$('authError').textContent=message;const ready=!!sb;$('authForms').innerHTML=ready?`<form class="panel" id="loginForm"><h2>${t('login')}</h2><div class="field"><label>${t('email')}</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>${t('password')}</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit">${t('login')}</button></form><form class="panel" id="signupForm"><h2>${t('signup')}</h2><div class="field"><label>${t('nickname')}</label><input name="nickname" minlength="3" maxlength="20" required></div><div class="field"><label>${t('email')}</label><input name="email" type="email" required></div><div class="field"><label>${t('password')}</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>${t('repeat')}</label><input name="repeat" type="password" minlength="8" required></div><button class="btn primary" type="submit">${t('signup')}</button></form>`:`<div class="panel"><h2>${t('unavailable')}</h2><p class="muted">${message||t('offline')}</p><button class="btn primary" id="retryAuth">${t('retry')}</button></div>`;if(!ready){$('retryAuth').onclick=initAuth;return}$('loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const {error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)throw error;await initAuth()}catch(err){log('ERROR',err.message);$('authError').textContent=err.message}};$('signupForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),nick=String(f.get('nickname')).trim();if(nick.length<3||nick.length>20||f.get('password')!==f.get('repeat')){$('authError').textContent='Проверь ник и совпадение паролей';return}try{const {data,error}=await sb.auth.signUp({email:f.get('email'),password:f.get('password'),options:{data:{nickname:nick}}});if(error)throw error;if(data.session){await initAuth()}else $('authError').textContent='Аккаунт создан. Если требуется подтверждение e-mail, подтвердите его и войдите.'}catch(err){log('ERROR',err.message);$('authError').textContent=err.message}}}
async function initAuth(){try{if(!window.supabase)throw Error('Supabase CDN unavailable');if(!sb)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const {data,error}=await sb.auth.getSession();if(error)throw error;if(!data?.session?.user){user=null;$('appRoot').hidden=true;$('authRoot').hidden=false;renderAuth();return}user=data.session.user;profile={...profile,...safeJSON(localStorage.getItem(profileKey()),{})};profile.nickname=profile.nickname||user.user_metadata?.nickname||user.email?.split('@')[0]||'KairoKit';profile.created_at=profile.created_at||user.created_at;profile.unlocked=profile.unlocked||{};$('authRoot').hidden=true;$('appRoot').hidden=false;renderApp();syncCloud()}catch(err){log('ERROR','Auth: '+err.message);$('appRoot').hidden=true;$('authRoot').hidden=false;renderAuth(t('unavailable')+': '+err.message)}}
function renderApp(){document.documentElement.lang=lang;$('appBrand').innerHTML=brand();$('menuToggle').innerHTML=icon('menu');$('language').textContent=lang==='ru'?'RU | en':'ru | EN';$('mainTabs').innerHTML=['home','library','network','profile'].map(id=>`<button class="btn ${activeTab===id?'active':''}" data-tab="${id}">${t(id)}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;release=null;renderApp()});$('menu').hidden=true;renderMenu();$('appContent').innerHTML=activeTab==='home'?renderHome():activeTab==='library'?renderLibrary():activeTab==='network'?renderNetwork():renderProfile();bindContent()}
function renderMenu(){$('menu').innerHTML=MENU_ITEMS.map(m=>m.id==='divider'?'<hr>':`<button data-menu="${m.action}">${icon(m.icon,16)} &nbsp; ${lang==='ru'?m.ru:m.en}</button>`).join('');$('menu').querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{const a=b.dataset.menu;$('menu').hidden=true;if(a==='github')window.open('https://github.com/affhotaru/kairokit','_blank','noopener');else if(a==='report'){const txt=logs.map(x=>`${x.time} [${x.level}] ${x.text}`).join('\n')||'No log entries';navigator.clipboard?.writeText(txt).then(()=>notify('Журнал скопирован')).catch(()=>showModal(`<h2>Журнал</h2><textarea rows="12">${esc(txt)}</textarea>`))}else if(a==='changelog')showModal('<h2>'+t('changelog')+'</h2>'+CHANGELOG.map(x=>`<div class="panel"><b>${x.version}</b><p>${esc(x[lang])}</p></div>`).join(''));else if(a==='about')showModal('<h2>KairoKit</h2><p>Динамическая библиотека просмотренного аниме.</p><p>© 2026 KairoKit. Все права защищены.</p>');else if(a==='version')showModal('<h2>Version '+VERSION+'</h2>');else notify(t('soon'))})}
function renderHome(){return `<div class="wrap"><section class="hero"><div class="small">回路 · PERSONAL ANIME CIRCUIT</div><h1>KAIROKIT</h1><p>Динамическая библиотека просмотренного аниме</p></section></div><div class="ticker"><span>${(' ◇ KAIROKIT · ARCHIVE · CIRCUIT · ANILIST · '+active().length+' TITLES · ').repeat(8)}</span></div><div class="wrap"><h2>Статус проекта</h2><div class="grid three"><div class="stat"><span class="small">VERSION</span><b>${VERSION}</b></div><div class="stat"><span class="small">CLOUD</span><b style="font-size:17px">${syncOnline?t('online'):t('offline')}</b></div><div class="stat"><span class="small">ANILIST</span><b style="font-size:17px">${aniOnline?t('online'):t('offline')}</b></div></div><h2>${t('changelog')}</h2>${CHANGELOG.map(c=>`<div class="panel"><b>${c.version}</b><p class="muted">${esc(c[lang])}</p></div>`).join('')}<a class="btn" style="display:inline-block" href="https://github.com/affhotaru/kairokit" target="_blank" rel="noopener">GitHub</a></div>`}
function renderLibrary(){if(release)return renderRelease();return `<div class="wrap"><h2>${t('library')}</h2><div class="library-switch"><button class="btn ${libraryView==='catalog'?'active':''}" data-libraryview="catalog">Поиск аниме</button><button class="btn ${libraryView==='bookmarks'?'active':''}" data-libraryview="bookmarks">Закладки (${active().length})</button></div>${libraryView==='bookmarks'?renderLibraryBookmarks():`<p class="muted">AniList · Shikimori</p><input id="librarySearch" placeholder="${t('search')}" value="${esc(searchQuery)}" autocomplete="off"><div class="small" id="libraryMessage" style="margin:12px 0">${searchQuery?'':'Введите название на русском или английском'}</div><div class="covergrid" id="libraryResults">${searchResults.map(coverCard).join('')}</div>`}</div>`}
function coverCard(a){return `<button class="covercard" data-release="${a.id}"><img loading="lazy" src="${esc(a.coverImage?.large||a.cover||'')}" alt=""><div class="inside"><b>${esc(displayTitle(a))}</b><small>${a.episodes||'?'} эп · ${a.startDate?.year||a.year||'—'} · ${fmtFormat(a.format)}</small></div></button>`}function displayTitle(a){const titles=[a.russian,a.title?.english,a.title?.romaji,a.title?.native].filter(x=>typeof x==='string'&&x.trim());return [...new Set(titles)].join(' / ')||'—'}

function renderProfile(){const sections=[['stats',t('stats'),'Числа и оценки'],['timeline',t('timeline'),'История просмотра'],['data',t('data'),'Импорт и экспорт']];return `<div class="wrap"><div class="banner" style="background:${BANNERS[profile.banner]||BANNERS[0]}"></div><div class="profiletop"><div class="avatar">${profileAvatar()}</div><div><h2 style="margin:0">${esc(profile.nickname)} ${isOwner()?'✦':''}</h2><div class="small">${esc(isOwner()?'Основатель KairoKit · '+(profile.title||currentRank()):profile.title||currentRank())}</div></div></div><p class="muted">${esc(profile.bio||'...')}</p><div class="profile-actions"><button class="btn" id="openAvatarStudio">✦ Создать аватар</button><button class="btn" id="editProfile">${t('edit')}</button><button class="btn primary" id="addEntry">${t('add')}</button></div><div class="profile-actions">${sections.map(([id,name,desc])=>`<button class="btn ${profileTab===id?'active':''}" data-profiletab="${id}"><b>${name}</b><span class="small" style="display:block">${desc}</span></button>`).join('')}</div>${isOwner()?'<div class="admin-panel"><button class="btn primary" id="ownerPanel">✦ Открыть панель основателя</button><p class="small">Управление платформой · серверные разрешения</p></div>':''}<div id="profilePanel">${renderStatusPie()}${({bookmarks:renderBookmarks,collection:renderCollection,stats:renderStats,timeline:renderTimeline,data:renderData})[profileTab]?.()||renderBookmarks()}</div></div>`}
function renderBookmarks(){return `<h2>Закладки</h2><p class="small">Коллекция находится в разделе «Библиотека».</p><button class="btn primary" id="goLibraryBookmarks">Открыть закладки (${active().length})</button>`}

function renderLibraryBookmarks(){const groups=[['Просмотрено','#a855f7'],['Смотрю','#55b6ed'],['В планах','#e5cb72'],['Отложено','#f09b64'],['Брошено','#a2a399']];return `<div class="bookmark-toolbar"><label class="small" for="collectionSort">Сортировка</label><select id="collectionSort"><option value="date" ${collectionSort==='date'?'selected':''}>По дате</option><option value="score" ${collectionSort==='score'?'selected':''}>По оценке</option><option value="title" ${collectionSort==='title'?'selected':''}>По названию</option></select></div>${groups.map(([status,color])=>{let list=active().filter(a=>a.status===status);list.sort((a,b)=>collectionSort==='title'?a.title.localeCompare(b.title):collectionSort==='score'?(b.score??-1)-(a.score??-1):(b.date||'').localeCompare(a.date||'')||b.updated_at-a.updated_at);return `<details class="status-group" ${status==='Просмотрено'||status==='Смотрю'?'open':''} style="--group-color:${color}"><summary><span class="status-dot"></span><b>${status}</b><span class="small">${list.length}</span></summary><div class="status-items">${list.length?list.map((a,i)=>`<div class="status-item"><span class="status-num">${i+1}</span><img src="${esc(a.cover||'')}" loading="lazy" alt=""><div class="entry-body"><b>${esc(a.title)}</b><div class="small">${a.progress}/${a.episodes} эп. · ${a.score===null?'Без оценки':a.score+'/10'}</div></div><button class="btn" data-edit="${esc(a.id)}" aria-label="Редактировать">✎</button></div>`).join(''):'<p class="small">Пока пусто</p>'}</div></details>`}).join('')}`}
function renderCollection(){let list=active();if(collectionFilter!=='all')list=list.filter(x=>x.status===collectionFilter);if(collectionQuery)list=list.filter(x=>x.title.toLowerCase().includes(collectionQuery.toLowerCase()));list=[...list].sort((a,b)=>collectionSort==='title'?a.title.localeCompare(b.title):collectionSort==='score'?(b.score??-1)-(a.score??-1):(b.date||'').localeCompare(a.date||'')||b.updated_at-a.updated_at);return `<div class="row"><input style="flex:1;min-width:170px" id="collectionSearch" placeholder="${t('archiveSearch')}" value="${esc(collectionQuery)}"><select id="collectionSort" style="width:auto"><option value="date" ${collectionSort==='date'?'selected':''}>Дата</option><option value="score" ${collectionSort==='score'?'selected':''}>Оценка</option><option value="title" ${collectionSort==='title'?'selected':''}>Название</option></select></div><div class="subtabs">${['all',...STATUS].map((s,i)=>`<button class="btn ${collectionFilter===s?'active':''}" data-filter="${esc(s)}">${i?statusText(s):lang==='ru'?'Все':'All'} (${i?active().filter(x=>x.status===s).length:active().length})</button>`).join('')}</div>${list.length?list.map(a=>`<div class="entry"><img src="${esc(a.cover)}" loading="lazy" alt=""><div class="entry-body"><div class="entry-title" data-openentry="${esc(a.id)}">${esc(a.title)}</div><div class="entry-meta">${statusText(a.status)} · ${a.progress}/${a.episodes} эп · ${a.score===null?'—':a.score+'/10'}</div><div class="entry-controls"><button class="btn" data-plus="${esc(a.id)}">+1</button><button class="btn" data-edit="${esc(a.id)}">${t('edit')}</button><button class="btn" data-delete="${esc(a.id)}">×</button></div></div></div>`).join(''):'<div class="panel muted">Коллекция пока пуста</div>'}`}
function renderStats(){const a=active(),c=completed(),rated=a.filter(x=>x.score!==null),episodes=completedEpisodes();return `<div class="grid"><div class="stat"><span class="small">Всего тайтлов</span><b>${a.length}</b></div><div class="stat"><span class="small">Просмотрено</span><b>${c.length}</b></div><div class="stat"><span class="small">Эпизодов</span><b>${episodes}</b></div><div class="stat"><span class="small">Средняя оценка</span><b>${rated.length?(rated.reduce((n,x)=>n+x.score,0)/rated.length).toFixed(1):'—'}</b></div></div>`}
function renderTimeline(){const a=[...completed()].sort((x,y)=>(y.date||'').localeCompare(x.date||''));return a.length?a.map(x=>`<div class="entry"><div class="entry-body"><b>${esc(x.title)}</b><div class="small">${dateStr(x.date)} · ${x.score??'—'}/10</div></div></div>`).join(''):'<div class="panel muted">Хронология пока пуста</div>'}
function renderBadges(){const d=completed(),recent=BADGES.filter(b=>profile.unlocked[b.id]).sort((a,b)=>profile.unlocked[b.id]<profile.unlocked[a.id]?1:-1).slice(0,4);return `<h2>Недавние</h2><div class="row">${recent.length?recent.map(b=>`<button class="btn" data-badge="${b.id}">${esc(b.name)}</button>`).join(''):'<span class="muted">Пока нет значков</span>'}</div>${[...new Set(BADGES.map(b=>b.section))].map(section=>`<h2>${section}</h2><div class="badgegrid">${BADGES.filter(b=>b.section===section).map(b=>{const v=b.check(d),got=!!profile.unlocked[b.id];return `<button class="badgecard ${got?'':'locked'}" data-badge="${b.id}">${badgeIcon(b.icon)}<b>${b.hidden&&!got?'???':esc(b.name)}</b><div class="small">${b.hidden&&!got?'???':esc(b.code)}</div><div class="bar"><i style="width:${Math.min(100,v.cur/v.max*100)}%"></i></div><div class="small">${v.cur}/${v.max}</div></button>`}).join('')}</div>`).join('')}`}

function showModal(content){$('modalRoot').hidden=false;$('modalRoot').innerHTML=`<div class="modal"><div class="modalhead"><span class="small">KAIROKIT</span><button class="btn" id="closeModal">✕</button></div>${content}</div>`;$('closeModal').onclick=closeModal}function closeModal(){$('modalRoot').hidden=true;$('modalRoot').innerHTML=''}function recordById(id){return records.find(x=>x.id===id&&!x.deleted)}
function openEntryForm(id='',media=null){const a=id?recordById(id):null,m=media||{},v=a||{title:displayTitle(m)==='—'?'':displayTitle(m),score:null,episodes:m.episodes||0,progress:0,status:'В планах',date:'',note:'',cover:m.coverImage?.large||'',anilistId:m.id||null};showModal(`<h2>${a?t('edit'):t('add')}</h2><form id="recordForm"><div class="field"><label>${t('title')}</label><input name="title" required value="${esc(v.title)}"></div><div class="grid"><div class="field"><label>${t('status')}</label><select name="status">${STATUS.map(s=>`<option ${v.status===s?'selected':''} value="${s}">${statusText(s)}</option>`).join('')}</select></div><div class="field"><label>${t('mine')} (1–10)</label><select name="score"><option value="">— Без оценки —</option>${Array.from({length:10},(_,i)=>i+1).map(n=>`<option value="${n}" ${v.score===n?'selected':''}>${n} / 10</option>`).join('')}</select></div><div class="field"><label>${t('progress')}</label><input name="progress" type="number" min="0" value="${v.progress||0}"></div><div class="field"><label>${t('episodes')}</label><input name="episodes" type="number" min="0" value="${v.episodes||0}"></div></div><div class="field"><label>${t('date')}</label><input name="date" type="date" value="${esc(v.date||'')}"></div><div class="field"><label>${t('note')}</label><textarea name="note" maxlength="1200">${esc(v.note||'')}</textarea></div><button class="btn primary" type="submit">${t('save')}</button></form>`);$('recordForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),data={...v,title:String(f.get('title')).trim(),status:f.get('status'),score:f.get('score')===''?null:Math.max(1,Math.min(10,num(f.get('score')))),progress:Math.max(0,num(f.get('progress'))),episodes:Math.max(0,num(f.get('episodes'))),date:f.get('date'),note:f.get('note'),updated_at:Date.now(),deleted:false};if(media){Object.assign(data,mediaToRecord(media))}if(a)Object.assign(a,data);else records.push(normalize({...data,id:uid()}));saveLocal();checkBadges function mediaToRecord(m){return {cover:m.coverImage?.large||m.cover||'',anilistId:m.id||m.anilistId||null,idMal:m.idMal||null,genres:m.genres||[],tags:(m.tags||[]).slice(0,5).map(x=>typeof x==='string'?x:x.name),format:m.format||'',year:m.startDate?.year||m.year||null,studio:m.studios?.nodes?.[0]?.name||m.studio||'',source:m.source||'',countryOfOrigin:m.countryOfOrigin||'',episodes:m.episodes||0}}
function editProfile(){showModal(`<h2>${t('edit')} · ${t('profile')}</h2><form id="profileForm"><div class="field"><label>${t('nickname')}</label><input name="nickname" minlength="3" maxlength="20" required value="${esc(profile.nickname)}"></div><div class="field"><label>${t('bio')} (120)</label><textarea name="bio" maxlength="120">${esc(profile.bio)}</textarea></div><h3>Аватар</h3><button class="btn primary" type="button" id="launchAvatarStudio">✦ Конструктор предметов и внешности</button><p class="small">24 аниме-портрета, оригинал основателя и геометрические аватары. Выбор сохраняется на этом устройстве.</p><div class="avatar-gallery">${isOwner()?`<label class="avatar-choice"><input type="radio" name="avatarChoice" value="founder" ${!profile.avatarChoice||profile.avatarChoice==='founder'?'checked':''}><img src="${KAIRO_AVATAR_IMAGES[0]}" alt="Мой оригинал"><span>Оригинал</span></label>`:''}${KAIRO_AVATAR_IMAGES.slice(1).map((src,i)=>`<label class="avatar-choice"><input type="radio" name="avatarChoice" value="preset-${i}" ${profile.avatarChoice===`preset-${i}`?'checked':''}><img src="${src}" alt="Аватар ${i+1}"></label>`).join('')}</div><div class="row"><button class="btn" type="button" id="randomAvatar">🎲 Случайный аватар</button><button class="btn" type="button" id="randomColors">🎨 Случайный баннер</button></div><h3>Баннер</h3><div class="grid three">${BANNERS.map((b,i)=>`<label class="stat" style="background:${b}"><input type="radio" name="banner" value="${i}" ${profile.banner===i?'checked':''}> ${i+1}</label>`).join('')}</div><div class="field"><label>${t('rank')}</label><select name="title"><option value="">${currentRank()}</option>${BADGES.filter(b=>profile.unlocked[b.id]).map(b=>`<option ${profile.title===b.name?'selected':''} value="${esc(b.name)}">${esc(b.name)}</option>`).join('')}</select></div><div class="field"><label>${t('pinned')} (до 3 ID записей через запятую)</label><input name="pinned" value="${esc(profile.pinned.join(','))}"></div><button class const DRAFT_CATALOG={legacySections:['Жанры','Объём и формат','Эпохи','Студии и франшизы','Оценки','Секретные'],anime:[{anime:'Бездомный бог / Noragami',badges:[{name:'Пять иен',description:'Добавить Noragami в просмотренные'},{name:'Имя, которое помнят',description:'Оценить Noragami на 9 или 10'},{name:'Граница двух миров',description:'Посмотреть оба сезона Noragami'}]}]};
function showFounderPanel(){if(!isOwner())return;showModal(`<h2>✦ Панель основателя</h2><p class="small">Режим подготовки. Владелец определяется по UUID, но права на изменение чужих данных должны проверяться Supabase RLS/RPC. До настройки сервера управление пользователями недоступно.</p><div class="founder-grid"><button class="btn" id="ownerCatalog">🏅 Каталог достижений</button><button class="btn" id="ownerRoles">👥 Пользователи и роли</button><button class="btn" id="ownerTitles">✦ Титулы и награды</button><button class="btn" id="ownerSettings">⚙ Настройки проекта</button></div>`);$('ownerCatalog').onclick=showOwnerCatalog;for(const [id,title] of [['ownerRoles','Пользователи и роли'],['ownerTitles','Титулы и награды'],['ownerSettings','Настройки проекта']])$(id).onclick=()=>{if(!isOwner())return;showModal(`<h2>${title}</h2><p>Этот раздел будет доступен после установки серверных политик и безопасных функций Supabase. Изменения чужих аккаунтов из публичного HTML не выполняются.</p><button class="btn" id="backOwner">Назад</button>`);$('backOwner').onclick=showFounderPanel}}
function showOwnerCatalog(){if(!isOwner())return;showModal('<h2>Каталог достижений · черновики</h2><p class="muted">Старые категории сохранены, но скрыты от пользователей. Новые достижения пока не выдаются.</p><p>'+DRAFT_CATALOG.legacySections.map(esc).join(' · ')+'</p>'+DRAFT_CATALOG.anime.map(x=>`<h3>${esc(x.anime)}</h3>`+x.badges.map(b=>`<div class="panel"><b>${esc(b.name)}</b><p class="small">${esc(b.description)}</p></div>`).join('')).join(''))}
function showBadge(id){const b=BADGES.find(x=>x.id===id);if(!b)return;const v=b.check(completed()),got=profile.unlocked[b.id];showModal(`${badgeIcon(b.icon)}<h2>${b.hidden&&!got?'???':esc(b.name)}</h2><p>${RARITY[b.rarity-1]} · ${esc(b.code)}</p><p>${t('description')}: ${got||!b.hidden?esc(b.how):'???'}</p><p>${got?dateStr(got.slice(0,10)):'—'}</p><div class="bar"><i style="width:${Math.min(100,v.cur/v.max*100)}%"></i></div><p>${v.cur}/${v.max}</p>${got?`<button class="btn primary" id="equipBadge">${t('equip')}</button>`:''}`);if(got)$('equipBadge').onclick=()=>{profile.equipped_badge=b.id;profile.title='';saveLocal();closeModal();renderApp()}}
function bindContent(){bindNetwork();if(activeTab==='profile'){document.querySelectorAll('[data-profiletab]').forEach(b=>b.onclick=()=>{profileTab=b.dataset.profiletab;renderApp()});$('editProfile')?.addEventListener('click',editProfile);$('openAvatarStudio')?.addEventListener('click',openAvatarStudio);$('ownerPanel')?.addEventListener('click',showFounderPanel);$('goLibraryBookmarks')?.addEventListener('click',()=>{activeTab='library';libraryView='bookmarks';release=null;renderApp()});$('addEntry')?.addEventListener('click',()=>openEntryForm());document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{collectionFilter=b.dataset.filter;renderApp()});$('collectionSort')?.addEventListener('change',e=>{collectionSort=e.target.value;renderApp()});$('collectionSearch')?.addEventListener('input',e=>{collectionQuery=e.target.value;const pos=e.target.selectionStart;renderApp();const el=$('collectionSearch');el.focus();el.setSelectionRange(pos,pos)});document.querySelectorAll('[data-openentry]').forEach(b=>b.onclick=()=>{const a=recordById(b.dataset.openentry);if(a?.anilistId)openRelease(a.anilistId);else openEntryForm(a.id)});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEntryForm(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Удалить запись?')){const a=recordById(b.dataset.delete);a.deleted=true;a.updated_at=Date.now();saveLocal();renderApp()}});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{const a=recordById(b.dataset.plus);a.progress++;if(a.progress>a.episodes)a.episodes=a.progress;a.history.push({episode:a.progress,time:Date.now()});a.updated_at=Date.now();saveLocal();checkBadges();renderApp()});document.querySelectorAll('[data-badge]').forEach(b=>b.onclick=()=>showBadge(b.dataset.badge));$('exportTxt')?.addEventListener('click',exportTxt);$('exportJson')?.addEventListener('click',exportJson);$('importJson')?.addEventListener('click',()=>$('importFile').click());$('pasteTxt')?.addEventListener('click',openPasteImport);$('logout')?.addEventListener('click',async()=>{try{await sb.auth.signOut()}catch(e){log('WARN',e.message)}user=null;records=[];profile={nickname:'',bio:'',avatar:0,banner:0,pinned:[],unlocked:{},equipped_badge:'',title:'',created_at:''};$('appRoot').hidden=true;$('authRoot').hidden=false;renderAuth()})}if(activeTab==='library'){document.querySelectorAll('[data-libraryview]').forEach(b=>b.onclick=()=>{libraryView=b.dataset.libraryview;renderApp()});if(!release&&libraryView==='bookmarks'){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEntryForm(b.dataset.edit));$('collectionSort')?.addEventListener('change',e=>{collectionSort=e.target.value;renderApp()})}if(!release&&libraryView==='catalog'){$('librarySearch').oninput=e=>{searchQuery=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>runSearch(searchQuery),400)};document.querySelectorAll('[data-release]').forEach(b=>b.onclick=()=>openRelease(b.dataset.release))}else bindRelease()}}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}function exportJson(){download('kairokit-backup.json',JSON.stringify({app:'KairoKit',version:VERSION,records,profile},null,2),'application/json')}function exportTxt(){download('kairokit-archive.txt',STATUS.map(s=>`\n=== ${s} ===\n`+active().filter(x=>x.status===s).map(x=>`${x.title} — ${x.score===null?'без оценки':x.score+'/10'} — серий ${x.progress} из ${x.episodes} — ${x.date||'без даты'}`).join('\n')).join('\n'),'text/plain;charset=utf-8')}
function parseAnimeList(text){return text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^\s*(?:\d{1,5}\s*[.)、:：-]\s*|[-•*]\s*)/,'').trim()).filter(x=>x&&!/^(?:просмотренные аниме|аниме начал смотреть|список аниме)\s*:?$/i.test(x)).filter(x=>x.length>1).slice(0,3000)}
function importTitles(text){const titles=parseAnimeList(text);if(!titles.length){notify('Не удалось найти названия');return}const existing=new Set(active().map(x=>x.title.toLowerCase()));let added=0;for(const title of titles){if(existing.has(title.toLowerCase()))continue;records.push(normalize({title,status:'Просмотрено',id:uid(),updated_at:Date.now()}));existing.add(title.toLowerCase());added++}saveLocal();closeModal();renderApp();notify('Импортировано: '+added+'; пропущено повторов: '+(titles.length-added))}
function openPasteImport(){showModal('<h2>Импорт списка аниме</h2><p class="muted">Вставь нумерованный список из Заметок. Все новые названия будут добавлены со статусом «Просмотрено». Автоматический поиск обложек выполняется отдельно.</p><textarea id="pasteAnime" rows="10" placeholder="1. Бездомный бог\n2. Тетрадь смерти"></textarea><button class="btn primary" id="previewAnime">Проверить список</button><div id="previewArea"></div>');$('previewAnime').onclick=()=>{const raw=$('pasteAnime').value,items=parseAnimeList(raw);$('previewArea').innerHTML='<p>Найдено: '+items.length+'</p><div class="panel import-preview">'+items.slice(0,25).map(esc).join('<br>')+'</div><button class="btn primary" id="confirmPaste">Импортировать</button>';$('confirmPaste').onclick=()=>{if(confirm('Добавить '+items.length+' записей в просмотренное?'))importTitles(raw)}}}
$('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const text=await f.text();if(/\.txt$/i.test(f.name)||f.type==='text/plain'){const list=parseAnimeList(text);if(confirm('Добавить '+list.length+' названий в просмотренное?'))importTitles(text)}else{const data=JSON.parse(text),list=Array.isArray(data)?data:data.records;if(!Array.isArray(list))throw Error('Invalid JSON');if(!confirm('Импортировать записи?'))return;const map=new Map(records.map(x=>[x.id,x]));list.map(normalize).forEach(x=>map.set(x.id,x));records=[...map.values()];if(data.profile)profile={...profile,...data.profile};saveLocal();renderApp();notify('Импорт завершён')}}catch(err){notify(err.message)}e.target.value=''};

const MEDIA_FIELDS=`id idMal title{romaji english native} synonyms coverImage{large extraLarge} description(asHtml:false) format episodes duration season seasonYear startDate{year month day} status source countryOfOrigin averageScore isAdult genres tags{name} studios{nodes{name}} relations{edges{relationType node{id}}}`;
async function graphql(query,variables={}){const now=Date.now();apiTimes=apiTimes.filter(x=>now-x<60000);if(apiTimes.length>=55)throw Error('AniList rate limit (55/min)');apiTimes.push(now);const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),12000);try{const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query,variables}),signal:ctrl.signal});if(!r.ok)throw Error('AniList HTTP '+r.status);const j=await r.json();if(j.errors?.length)throw Error(j.errors[0].message);aniOnline=true;return j.data}finally{clearTimeout(timer)}}
async function runSearch(q){const seq=++searchSeq;if(q.trim().length<2){searchResults=[];if(activeTab==='library'&&!release)renderApp();return}try{const queries=[graphql(`query($q:String){Page(page:1,perPage:10){media(search:$q,type:ANIME,sort:POPULARITY_DESC){${MEDIA_FIELDS}}}}`,{q})];queries.push(fetch('https://shikimori.one/api/animes?search='+encodeURIComponent(q)+'&limit=10&order=popularity',{headers:{Accept:'application/json'}}).then(r=>{if(!r.ok)throw Error('Shikimori '+r.status);return r.json()}).catch(e=>{log('WARN','Shikimori: '+e.message);return []}));const [an,sh]=await Promise.all(queries);if(seq!==searchSeq)return;const list=an.Page.media||[],mal=new Set(list.map(x=>Number(x.idMal)).filter(Boolean));for(const x of sh||[]){const existing=list.find(a=>Number(a.idMal)===Number(x.id));if(existing&&x.russian)existing.russian=x.russian;}for(const x of sh||[]){if(mal.has(Number(x.id)))continue;mal.add(Number(x.id));list.push({id:'mal:'+x.id,idMal:x.id,russian:x.russian||x.name,title:{romaji:x.name},coverImage:{large:x.image?.original?'https://shikimori.one'+x.image.original:''},episodes:x.episodes,format:x.kind?.toUpperCase(),year:x.aired_on?.slice(0,4)})}searchResults=list.slice(0,10);if(activeTab==='library'&&!release)renderApp()}catch(err){log('WARN','AniList search: '+err.message);aniOnline=false;if(seq===searchSeq&&$('libraryMessage'))$('libraryMessage').textContent='Поиск недоступен: '+err.message}}
async function fetchMedia(id){if(String(id).startsWith('mal:')){const mal=Number(String(id).slice(4));const data=await graphql(`query($id:Int){Media(idMal:$id,type:ANIME){${MEDIA_FIELDS}}}`,{id:mal});return data.Media}const data=await graphql(`query($id:Int){Media(id:$id,type:ANIME){${MEDIA_FIELDS}}}`,{id:Number(id)});return data.Media}
async function openRelease(id){activeTab='library';release={id,loading:true};renderApp();try{release=await fetchMedia(id);if(!release)throw Error('Release not found');renderApp();loadFranchise(release).then(()=>{if(activeTab==='library'&&release)renderApp()}).catch(e=>log('WARN','Franchise: '+e.message))}catch(err){log('WARN','Release: '+err.message);release={id,error:err.message};renderApp()}}
function renderRelease(){if(release.loading)return '<div class="wrap panel">Загрузка релиза…</div>';if(release.error)return `<div class="wrap panel">${esc(release.error)} <button class="btn" id="releaseBack">←</button></div>`;const m=release,a=active().find(x=>Number(x.anilistId)===Number(m.id)),desc=(m.description||'').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' '),full=detailExpanded?desc:desc.slice(0,420),related=franchiseCache.get(m.id)||[];return `<div class="wrap"><button class="btn" id="releaseBack" style="margin:15px 0">← ${t('library')}</button><div class="releasehero" style="--cover:url('${esc(m.coverImage?.large||'')}')"><div class="releasecontent"><img src="${esc(m.coverImage?.extraLarge||m.coverImage?.large||'')}" alt=""><div><h2 style="margin:0">${esc(displayTitle(m))}</h2><p class="small">${esc(m.title?.native||'')}</p><span class="chip">${m.isAdult?'18+':'13+'}</span><p class="small">${fmtFormat(m.format)} · ${m.startDate?.year||'—'}</p></div></div></div><div class="panel"><label class="small">${t('status')}</label><select id="releaseStatus"><option value="">${t('none')}</option>${STATUS.map(s=>`<option value="${s}" ${a?.status===s?'selected':''}>${statusText(s)}</option>`).join('')}</select><div class="row" style="margin-top:12px"><button class="btn" id="releaseFavorite">${a?.favorite?'★':'☆'} ${t('favorite')}</button><button class="btn" id="releaseEdit">${a?t('edit'):t('add')}</button></div></div><div class="facts">${[['globe',t('country'),(m.countryOfOrigin||'—')+' · '+(m.season||'')+' '+(m.startDate?.year||'')],['clock',t('episodes'),(m.episodes||'?')+' × '+(m.duration||'?')+' min'],['calendar',t('airing'),m.status||'—'],['layers',t('source'),m.source||'—'],['film',t('studio'),m.studios?.nodes?.map(x=>x.name).join(', ')||'—'],['info',t('director'),'—']].map(([ic,label,value])=>`<div class="fact">${icon(ic)}<div><div class="small">${label}</div><b>${esc(value)}</b></div></div>`).join('')}</div><div class="row">${(m.genres||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><h2>${t('description')}</h2><p class="description">${esc(full||t('unknown'))}</p>${desc.length>420?`<button class="btn" id="expandDescription">${t(detailExpanded?'less':'more')}</button>`:''}<h2>${t('rating')}</h2><div class="grid"><div class="stat"><span class="small">AniList</span><b>${m.averageScore?m.averageScore/10:'—'} / 10</b></div><div class="stat"><span class="small">${t('mine')}</span><b>${a?.score??'—'} / 10</b></div></div><h2>${t('related')}</h2><p class="small">Релизы в порядке выхода (по данным AniList)</p>${related.length?related.map((x,index)=>{const saved=active().find(a=>Number(a.anilistId)===Number(x.id));return `<div class="release-row"><span class="order-num">${index+1}</span><img loading="lazy" src="${esc(x.coverImage?.large||'')}" alt=""><div class="entry-body"><b data-related="${x.id}">${esc(displayTitle(x))}</b><div class="small">${x.episodes||'?'} эп · ★ ${x.averageScore?Math.round(x.averageScore/10*10)/10:'—'} · ${x.season||''} ${x.startDate?.year||''} · ${fmtFormat(x.format)}</div><div class="small" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc((x.description||'').replace(/<[^>]*>/g,''))}</div>${saved?`<span class="chip">${statusText(saved.status)}</span>`:''}<select data-relatedstatus="${x.id}"><option value="">Отметить…</option><option value="Смотрю">${t('watching')}</option><option value="Просмотрено">${t('completed')}</option><option value="В планах">${t('planned')}</option><option value="remove">Убрать</option></select></div></div>`}).join(''):'<div class="panel muted">Связанные релизы загружаются или отсутствуют</div>'}</div>`}

async function loadFranchise(m){const cacheKey='kairo_franchise_v2_'+m.id;const cached=safeJSON(sessionStorage.getItem(cacheKey),null);if(cached){franchiseCache.set(m.id,cached);return}const seen=new Set([m.id]),queue=[{id:m.id,depth:0}],nodes=new Map([[m.id,m]]);while(queue.length&&seen.size<25){const batch=queue.splice(0,5),ids=batch.map(x=>x.id);let data;try{const vars=ids.map((id,i)=>`m${i}:Media(id:${id},type:ANIME){${MEDIA_FIELDS}}`).join(' ');data=await graphql(`query{${vars}}`)}catch(e){log('WARN','Franchise batch: '+e.message);break}batch.forEach((item,i)=>{const x=data['m'+i];if(!x)return;nodes.set(x.id,x);if(item.depth>=3)return;for(const edge of x.relations?.edges||[]){const id=edge.node?.id;if(!id||seen.has(id)||seen.size>=25)continue;seen.add(id);queue.push({id,depth:item.depth+1})}})}const list=[...nodes.values()].filter(x=>x.id!==m.id).sort((a,b)=>(a.startDate?.year||9999)-(b.startDate?.year||9999)||(a.startDate?.month||0)-(b.startDate?.month||0));franchiseCache.set(m.id,list);try{sessionStorage.setItem(cacheKey,JSON.stringify(list))}catch(e){log('WARN',e.message)}const ids=[m.id,...list.map(x=>x.id)];for(const a of active())if(ids.includes(Number(a.anilistId)))a.franchiseIds=ids;saveLocal()}

async function syncCloud(){if(!sb||!user||syncBusy)return;syncBusy=true;try{const {data,error}=await sb.from('anime_records').select('*').eq('user_id',user.id);if(error)throw error;const localMap=new Map(records.map(x=>[x.id,x]));for(const row of data||[]){const remote=fromCloud(row),local=localMap.get(remote.id);if(!local||remote.updated_at>local.updated_at)localMap.set(remote.id,remote)}records=[...localMap.values()];const remoteMap=new Map((data||[]).map(x=>[x.id,x]));const pending=records.filter(x=>!remoteMap.has(x.id)||x.updated_at>num(remoteMap.get(x.id).updated_at));if(pending.length){const {error:e}=await sb.from('anime_records').upsert(pending.map(toCloud),{onConflict:'id'});if(e){log('WARN','Extended columns unavailable; trying legacy schema: '+e.message);const basic=pending.map(x=>({id:x.id,user_id:user.id,title:x.title,score:x.score,episodes:x.episodes,progress:x.progress,status:x.status,favorite:x.favorite,date:x.date||null,note:x.note,cover:x.cover,anilist_id:x.anilistId,history:x.history,updated_at:x.updated_at,deleted:x.deleted}));const {error:legacyError}=await sb.from('anime_records').upsert(basic,{onConflict:'id'});if(legacyError)throw legacyError}}const {data:profiles,error:pe}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(pe)log('WARN','Profile fetch: '+pe.message);else if(profiles){profile={...profile,...profiles,unlocked:profiles.unlocked||profile.unlocked};}const {error:ue}=await sb.from('profiles').upsert({id:user.id,nickname:profile.nickname,bio:profile.bio,avatar:profile.avatar,banner:profile.banner,pinned:profile.pinned,unlocked:profile.unlocked,equipped_badge:profile.equipped_badge,title:profile.title},{onConflict:'id'});if(ue)log('WARN','Profile save: '+ue.message);try{localStorage.setItem(STORAGE_KEY,JSON.stringify(records));localStorage.setItem(profileKey(),JSON.stringify(profile))}catch(e){}syncOnline=true;checkBadges();renderApp()}catch(err){syncOnline=false;log('WARN','Cloud sync: '+err.message)}finally{syncBusy=false}}

function openAvatarStudio(){if(!user)return;const d=getAvatarDesign();const label={gender:'Тип персонажа',face:'Форма лица',skin:'Оттенок кожи',hair:'Цвет волос',hairstyle:'Причёска',eyes:'Цвет глаз',eyeShape:'Форма глаз',pupils:'Символ в глазах',expression:'Выражение лица',accessory:'Аксессуар',mark:'Отметины и шрамы',outfit:'Одежда',outfitColor:'Цвет одежды',background:'Фон',flip:'Направление'};showModal(`<h2>✦ Мастерская аватаров</h2><p class="small">Полноценный многослойный SVG-конструктор. 15 вариантов большинства категорий, наушники для обоих типов персонажей. Пока это коллекционный образ, не блокчейн-токен.</p><div class="studio-preview" id="studioPreview"></div><div class="studio-grid">${Object.keys(STUDIO_OPTIONS).map(k=>`<label>${label[k]}<select data-studio="${k}">${STUDIO_OPTIONS[k].map((name,i)=>`<option value="${i}" ${d[k]===i?'selected':''}>${esc(name)}</option>`).join('')}</select></label>`).join('')}</div><div class="studio-actions"><button class="btn" id="studioRandom">🎲 Случайный</button><button class="btn" id="studioExport">↓ SVG</button><button class="btn primary" id="studioSave">Сохранить аватар</button></div><p class="small">Образ сохраняется отдельно для вашего аккаунта в этом браузере. Параметры не передаются в Supabase и не являются NFT. SVG можно экспортировать.</p>`);const draw=()=>{$('studioPreview').innerHTML=avatarStudioSVG(d)};draw();document.querySelectorAll('[data-studio]').forEach(el=>el.onchange=()=>{d[el.dataset.studio]=Number(el.value);draw()});$('studioRandom').onclick=()=>{for(const k of Object.keys(STUDIO_OPTIONS))d[k]=Math.floor(Math.random()*STUDIO_OPTIONS[k].length);document.querySelectorAll('[data-studio]').forEach(el=>el.value=d[el.dataset.studio]);draw()};$('studioExport').onclick=()=>download('kairokit-avatar.svg',avatarStudioSVG(d),'image/svg+xml;charset=utf-8');$('studioSave').onclick=()=>{try{localStorage.setItem('kairokit_avatar_studio_'+user.id,JSON.stringify(d))}catch(e){notify('Недостаточно места в браузере');return}profile.avatarChoice='studio';saveLocal();closeModal();renderApp();notify('Образ сохранён на устройстве')}}
function renderStatusPie(){const groups=[['Просмотрено','#a855f7'],['Смотрю','#55b6ed'],['В планах','#e5cb72'],['Отложено','#f09b64'],['Брошено','#a2a399']],a=active(),total=a.length;let cur=0;const segments=groups.map(([name,color])=>{const count=a.filter(x=>x.status===name).length;const start=cur;cur+=total?count/total*100:0;return {name,color,count,start,end:cur}});const gradient=total?'conic-gradient('+segments.filter(x=>x.count).map(x=>`${x.color} ${x.start}% ${x.end}%`).join(',')+')':'conic-gradient(#414239 0% 100%)';return `<section class="panel"><h3>Распределение закладок</h3><div class="pie-layout"><div class="status-pie" role="img" aria-label="Круговая диаграмма статусов" style="background:${gradient}"></div><div class="pie-legend">${segments.map(x=>`<div><span><i style="background:${x.color}"></i>${x.name}</span><b>${x.count}</b></div>`).join('')}</div></div></section>`}
function renderNetwork(){return `<div class="wrap"><h2>Сеть</h2><p class="muted">Сообщество и будущая коллекционная экосистема KairoKit.</p><div class="grid"><button class="panel network-tile" id="networkStore"><h3>◈ Магазин</h3><p class="small">Будущий рынок уникальных предметов и аватаров. Торговля ещё не включена.</p></button><button class="panel network-tile" id="networkStudio"><h3>✦ Мастерская</h3><p class="small">Создавай персонажа из независимых слоёв и экспортируй SVG.</p></button><button class="panel network-tile" id="networkCollection"><h3>◇ Мои образы</h3><p class="small">Текущий персональный образ и его параметры.</p></button><button class="panel network-tile" id="networkCommunity"><h3>◎ Сообщество</h3><p class="small">Профили, обмен и социальные функции — в разработке.</p></button></div><div class="panel"><h3>NFT: что потребуется</h3><p class="small">Для настоящих NFT нужны выбранный блокчейн, кошелёк, смарт-контракт, выпуск токенов, запись владельца в сети и защищённая торговля. Локальный SVG и обычная запись Supabase сами по себе не NFT. До разработки и аудита контрактов никакие платежи и передача прав не выполняются.</p></div></div>`}
function bindNetwork(){if(activeTab!=='network')return;$('networkStore')?.addEventListener('click',()=>showModal('<h2>◈ Магазин</h2><p class="muted">В разработке. NFT-маркет не запущен: нет контракта, кошельков и торгов. Никакие покупки не принимаются.</p>'));$('networkStudio')?.addEventListener('click',openAvatarStudio);$('networkCollection')?.addEventListener('click',()=>showModal(`<h2>Мой образ</h2><div class="studio-preview">${avatarStudioSVG(getAvatarDesign())}</div><button class="btn primary" id="collectionEditAvatar">Редактировать</button>`),setTimeout(()=>{$('collectionEditAvatar')?.addEventListener('click',openAvatarStudio)},0));$('networkCommunity')?.addEventListener('click',()=>showModal('<h2>Сообщество</h2><p class="muted">Пока закрыто. Публичные профили и обмен требуют серверной модели разрешений и модерации.</p>'))}

</script></body></html>
