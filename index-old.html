<title>KairoKit — Personal Anime Archive</title>
<style>
:root{
  --bg:#17180f;--bg2:#1d1e15;--panel:#202117;--panel2:#24251a;
  --line:rgba(224,225,197,.13);--line2:rgba(224,225,197,.24);
  --text:#eeeee3;--muted:#929382;--dim:#656656;
  --accent:#a855f7;--accent2:#c084fc;--glow:rgba(168,85,247,.22);
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden;padding-bottom:80px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 85% 5%,rgba(168,85,247,.075),transparent 34%),radial-gradient(ellipse at 5% 70%,rgba(132,142,75,.055),transparent 40%)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{width:min(100% - 32px,760px);margin:auto}

/* Topbar */
.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand-area{display:flex;align-items:center;gap:11px}
.mark{width:34px;height:34px;border:1px solid var(--accent);border-radius:10px;display:grid;place-items:center;color:var(--accent2);box-shadow:0 0 20px var(--glow);font:700 16px var(--mono);transform:rotate(-4deg)}
.brand-title{font:700 20px var(--mono);letter-spacing:.08em;color:var(--text)}
.brand-sub{font:10px var(--mono);letter-spacing:.14em;color:var(--muted);margin-top:2px}
.top-actions{display:flex;gap:8px}
.icon-btn,.btn{border:1px solid var(--line2);background:transparent;color:var(--text);border-radius:999px;padding:8px 14px;font:11px var(--mono);letter-spacing:.08em;transition:.2s}
.icon-btn{width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:16px}
.icon-btn:hover,.btn:hover{border-color:var(--accent);box-shadow:0 0 16px var(--glow);color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#170f20;font-weight:800}
.btn.primary:hover{background:var(--accent2);color:#171018}

/* Search bar header */
.header-search-wrap{padding:14px 0 6px}
.header-search{width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:11px 14px;font-size:13px;outline:none}
.header-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}

/* Bottom Nav Bar (Anixart style) */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:65px;background:rgba(23,24,15,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:30;padding:0 8px}
.nav-item{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:10px var(--mono);letter-spacing:.08em;transition:.2s}
.nav-item svg{width:20px;height:20px;fill:currentColor}
.nav-item.active{color:var(--accent2);text-shadow:0 0 12px var(--glow)}

/* Main Container & Modules */
main{padding:15px 0 40px}
.module{display:none}
.module.active{display:block}

/* Hero / Home elements */
.welcome-card{background:linear-gradient(120deg,rgba(168,85,247,.08),transparent 70%),var(--bg2);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
.welcome-title{font:700 18px var(--mono);margin-bottom:5px;color:var(--accent2)}
.welcome-desc{font:12px var(--sans);color:var(--muted)}
.section-title{font:700 14px var(--mono);letter-spacing:.1em;color:var(--muted);margin:24px 0 12px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
.stat-num{font:700 20px var(--mono);color:var(--accent2)}
.stat-lbl{font:9px var(--mono);color:var(--muted);letter-spacing:.1em;margin-top:4px}

/* Anime cards */
.anime-list{display:grid;gap:10px}
.anime-card{position:relative;border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:12px;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;transition:.2s}
.anime-card:hover{border-color:rgba(168,85,247,.4)}
.card-poster{width:64px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.card-body{min-width:0}
.status-badge{display:inline-block;font:9px var(--mono);letter-spacing:.1em;padding:3px 7px;border-radius:4px;background:var(--panel);border:1px solid var(--line2);color:var(--accent2);margin-bottom:4px}
.card-title{font:700 14px var(--sans);margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font:11px var(--mono);color:var(--muted);display:flex;gap:10px}
.card-note{font:11px var(--sans);color:#a9aa99;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.score-pill{font:700 14px var(--mono);color:var(--accent2);background:var(--panel);border:1px solid var(--line);padding:4px 8px;border-radius:6px}
.action-row{display:flex;gap:5px}

/* Subtabs for Bookmarks */
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:15px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtab{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:7px 12px;border-radius:8px;font:11px var(--mono);white-space:nowrap;transition:.2s}
.subtab.active{background:var(--accent);color:#170f20;border-color:var(--accent);font-weight:700}

/* Toolbar & Filters */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:15px}
.toolbar select,.toolbar button{background:var(--panel);border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:9px 12px;font:11px var(--mono);outline:none}

/* Modals & Backdrop */
.modal-backdrop{position:fixed;inset:0;background:rgba(5,6,3,.8);backdrop-filter:blur(8px);z-index:40;display:none;align-items:flex-end;justify-content:center;padding:15px}
.modal-backdrop.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(100%,540px);max-height:90vh;overflow-y:auto;background:#202117;border:1px solid var(--line2);border-radius:16px;padding:20px;box-shadow:0 20px 60px #0009;animation:slide .25s}
@keyframes slide{from{transform:translateY(20px);opacity:.7}to{transform:translateY(0);opacity:1}}
.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-top h3{font:700 16px var(--mono);margin:0;color:var(--accent2)}
.close-btn{border:1px solid var(--line);background:none;color:var(--muted);border-radius:50%;width:32px;height:32px;font-size:16px}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font:10px var(--mono);letter-spacing:.1em;color:var(--muted)}
.field input,.field textarea,.field select{background:var(--panel);border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:10px;font-size:13px;outline:none;width:100%}
.field textarea{min-height:75px;resize:vertical}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* Profile screen */
.profile-banner{height:120px;background:var(--panel);border-radius:12px 12px 0 0;background-size:cover;background-position:center;border:1px solid var(--line);border-bottom:none;position:relative}
.profile-card{background:var(--bg2);border:1px solid var(--line);border-radius:0 0 12px 12px;padding:15px 20px 20px;margin-bottom:20px}
.profile-header{display:flex;align-items:flex-end;gap:15px;margin-top:-45px;margin-bottom:12px;position:relative}
.profile-avatar{width:76px;height:76px;border-radius:50%;border:3px solid var(--bg);background:var(--panel);overflow:hidden;display:grid;place-items:center}
.profile-info h2{font:700 18px var(--mono);margin:0;display:flex;align-items:center;gap:8px}
.profile-info p{font:12px var(--sans);color:var(--muted);margin:4px 0 0}
.profile-bio{font:12px var(--sans);color:#b5b6a3;margin-top:10px;line-height:1.4}
.profile-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:15px}
.profile-tab{background:none;border:none;color:var(--muted);font:11px var(--mono);letter-spacing:.08em;padding:6px 10px;border-radius:6px}
.profile-tab.active{background:var(--panel);color:var(--accent2);border:1px solid var(--line)}

/* Settings & Toast */
.settings-section{margin-bottom:20px}
.settings-section h4{font:11px var(--mono);color:var(--accent2);letter-spacing:.1em;margin:0 0 8px;text-transform:uppercase}
.settings-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font:12px var(--sans)}
.toast{position:fixed;bottom:80px;left:50%;transform:translate(-50%,15px);background:var(--accent);color:#160d20;padding:10px 16px;border-radius:99px;font:11px var(--mono);z-index:50;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 5px 20px var(--glow);max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty-state{border:1px dashed var(--line2);border-radius:12px;text-align:center;padding:35px 20px;color:var(--muted);font:12px/1.6 var(--mono)}
.empty-state strong{display:block;color:var(--text);font-size:14px;margin-bottom:5px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>

function loadProfile(){
  try{
    const d = JSON.parse(localStorage.getItem("kairokit_profile_v2") || "null");
    return d || {
      nickname: "Гость",
      avatar: AVATARS[0],
      banner: BANNERS[0],
      bio: "Исследую мир анимации в KairoKit.",
      pinned: [],
      settings: { viewMode: "list", defaultSub: "all", timeFormat: "days", compactMenu: false },
      equipped_badge: null,
      unlocked: {}
    };
  }catch(e){return {nickname:"Гость", avatar:AVATARS[0], banner:BANNERS[0], bio:"", pinned:[], settings:{}, unlocked:{}};}
}
function saveProfile(){
  localStorage.setItem("kairokit_profile_v2", JSON.stringify(profileData));
  syncToCloud();
}

function loadRecords(){
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    if(!Array.isArray(data)) return [];
    return data.map(x => ({
      id: x.id || uid(),
      supabaseId: x.supabaseId || x.id,
      title: x.title || "Без названия",
      score: Number(x.score || 8),
      episodes: Number(x.episodes || 12),
      progress: Number(x.progress !== undefined ? x.progress : (x.episodes || 12)),
      status: x.status || "Просмотрено",
      favorite: Boolean(x.favorite),
      genres: Array.isArray(x.genres) ? x.genres : [],
      year: Number(x.year || 2026),
      date: x.date || null,
      note: x.note || "",
      cover: x.cover || "",
      anilistId: x.anilistId || null,
      history: Array.isArray(x.history) ? x.history : [],
      updated_at: Number(x.updated_at || Date.now()),
      deleted: Boolean(x.deleted)
    }));
  } catch(e){ return []; }
}
function saveRecords(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  checkAchievements();
  syncToCloud();
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHTML(str=""){
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function notify(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(el.timer); el.timer = setTimeout(()=>el.classList.remove("show"), 2300);
}

const modules = [
  {id:"home", title:"Главная", render:renderHome},
  {id:"explore", title:"Обзор", render:renderExplore},
  {id:"bookmarks", title:"Закладки", render:renderBookmarks},
  {id:"profile", title:"Профиль", render:renderProfile}
];

function switchTab(tabId){
  currentTab = tabId;
  document.querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", b.dataset.tab === tabId));
  renderModules();
}

document.querySelectorAll(".nav-item").forEach(b => {
  b.onclick = () => switchTab(b.dataset.tab);
});

function renderModules(){
  const container = document.getElementById("modulesContainer");
  container.innerHTML = modules.map(m => `
    <div class="module ${m.id === currentTab ? 'active' : ''}" id="mod-${m.id}">
      ${m.render()}
    </div>
  `).join("");
  bindModuleEvents();
}

/* --- BOOKMARKS MODULE --- */
function renderBookmarks(){
  const statuses = ["all", "Смотрю", "В планах", "Просмотрено", "Отложено", "Брошено", "favorites", "history"];
  const counts = {
    all: records.filter(x=>!x.deleted).length,
    "Смотрю": records.filter(x=>!x.deleted && x.status==="Смотрю").length,
    "В планах": records.filter(x=>!x.deleted && x.status==="В планах").length,
    "Просмотрено": records.filter(x=>!x.deleted && x.status==="Просмотрено").length,
    "Отложено": records.filter(x=>!x.deleted && x.status==="Отложено").length,
    "Брошено": records.filter(x=>!x.deleted && x.status==="Брошено").length,
    "favorites": records.filter(x=>!x.deleted && x.favorite).length,
    "history": 0
  };

  const subNames = {
    all: "Все", "Смотрю": "Смотрю", "В планах": "В планах", "Просмотрено": "Просмотрено",
    "Отложено": "Отложено", "Брошено": "Брошено", "favorites": "Избранное", "history": "История"
  };

  let list = records.filter(x => !x.deleted);
  if(activeBookmarkSub === "favorites") list = list.filter(x => x.favorite);
  else if(activeBookmarkSub !== "all" && activeBookmarkSub !== "history") list = list.filter(x => x.status === activeBookmarkSub);

  return `
    <div class="subtabs">
      ${statuses.map(st => `<button class="subtab ${activeBookmarkSub===st?'active':''}" data-sub="${st}">${subNames[st]} (${counts[st]||0})</button>`).join("")}
    </div>

    ${activeBookmarkSub === 'history' ? renderHistoryTab() : `
      <div class="toolbar">
        <select id="bookmarkSort">
          <option value="date">Сортировка: По дате</option>
          <option value="score">Сортировка: По оценке</option>
          <option value="title">Сортировка: По названию</option>
        </select>
        <button class="btn" id="viewModeToggle">${bookmarkViewMode==='list'?'Сетка':'Список'}</button>
        <button class="btn primary" id="bmAddBtn">＋</button>
      </div>
      <div class="anime-list" style="${bookmarkViewMode==='grid'?'grid-template-columns:repeat(2,1fr)':''}">
        ${list.length ? list.map(a => renderAnimeCardHTML(a)).join('') : '<div class="empty-state"><strong>Список пуст</strong>В этой категории пока ничего нет.</div>'}
      </div>
    `}
  `;
}

function renderHistoryTab(){
  let allEvents = [];
  records.filter(x=>!x.deleted).forEach(a => {
    (a.history||[]).forEach(h => {
      allEvents.push({...h, title: a.title, animeId: a.id});
    });
  });
  allEvents.sort((a,b)=>b.time - a.time);

  if(!allEvents.length) return '<div class="empty-state"><strong>История пуста</strong>Изменения прогресса появятся здесь.</div>';

  return `
    <div style="display:grid;gap:8px">
      ${allEvents.map(ev => {
        const d = new Date(ev.time);
        const timeStr = d.toLocaleDateString("ru-RU", {day:"2-digit", month:"short"}) + " в " + d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
        return `<div style="background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center">
          <div><div style="font:700 13px var(--sans)">${escapeHTML(ev.title)}</div><div style="font:11px var(--mono);color:var(--accent2);margin-top:2px">${ev.episode} серия</div></div>
          <div style="font:10px var(--mono);color:var(--muted)">${timeStr}</div>
        </div>`;
      }).join("")}
    </div>
  `;
}

function renderAnimeCardHTML(a){
  const prog = a.progress !== undefined ? a.progress : a.episodes;
  return `
    <article class="anime-card" data-id="${a.id}">
      <img class="card-poster" src="${escapeHTML(a.cover || '')}" alt="" loading="lazy" onerror="this.style.display='none'">
      <div class="card-body">
        <div><span class="status-badge">${escapeHTML(a.status)}</span> ${a.favorite?'<span style="color:var(--accent2)">★</span>':''}</div>
        <div class="card-title">${escapeHTML(a.title)}</div>
        <div class="card-meta"><span>${prog} из ${a.episodes} эп.</span><span>${Number(a.score||0)} ★</span></div>
        ${a.note ? `<div class="card-note">${escapeHTML(a.note)}</div>` : ''}
      </div>
      <div class="card-right">
        <div class="score-pill">${Number(a.score||0)}</div>
        <div class="action-row">
          <button class="icon-btn" style="width:32px;height:32px;font-size:14px" data-plus1="${a.id}" title="+1 эпизод">+1</button>
        </div>
      </div>
    </article>
  `;
}

/* --- PROFILE MODULE --- */
function renderProfile(){
  const activeRecords = records.filter(x=>!x.deleted);
  const totalAnime = activeRecords.length;
  const totalEp = activeRecords.reduce((s,x)=>s+Number(x.progress||0),0);
  const avgScore = totalAnime ? (activeRecords.reduce((s,x)=>s+Number(x.score||0),0)/totalAnime).toFixed(1) : "0";
  const watchDays = (totalEp * 24 / 1440).toFixed(1);

  return `
    <div class="profile-banner" style="background-image: ${profileData.banner}"></div>
    <div class="profile-card">
      <div class="profile-header">
        <div class="profile-avatar">
          <svg viewBox="0 0 24 24" style="width:40px;height:40px;fill:var(--accent2)"><path d="${profileData.avatar}"/></svg>
        </div>
        <div style="flex:1">
          <h2>${escapeHTML(profileData.nickname)}</h2>
          <p>Архивариус аниме</p>
        </div>
        <button class="btn" id="editProfileBtn">ИЗМЕНИТЬ</button>
      </div>
      <div class="profile-bio">${escapeHTML(profileData.bio)}</div>
    </div>

    <div class="profile-tabs">
      <button class="profile-tab active" data-ptab="stats">Статистика</button>
      <button class="profile-tab" data-ptab="ratings">Оценки</button>
      <button class="profile-tab" data-ptab="badges">Значки</button>
    </div>

    <div id="profileTabContent">
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-num">${watchDays} дн.</div><div class="stat-lbl">ВРЕМЯ ПРОСМОТРА</div></div>
        <div class="stat-box"><div class="stat-num">${totalEp}</div><div class="stat-lbl">ЭПИЗОДОВ</div></div>
        <div class="stat-box"><div class="stat-num">${avgScore}</div><div class="stat-lbl">СР. ОЦЕНКА</div></div>
      </div>
      <div class="section-title">ДИНАМИКА ПРОСМОТРА СЕРИЙ (14 ДНЕЙ)</div>
      ${renderActivityGraph(activeRecords)}
    </div>
  `;
}

function renderActivityGraph(activeRecords){
  let days = {};
  for(let i=13; i>=0; i--){
    let d = new Date(); d.setDate(d.getDate() - i);
    days[d.toISOString().slice(0,10)] = 0;
  }
  activeRecords.forEach(a => {
    (a.history||[]).forEach(h => {
      let ds = new Date(h.time).toISOString().slice(0,10);
      if(days[ds] !== undefined) days[ds]++;
    });
  });
  const maxVal = Math.max(...Object.values(days), 5);
  return `
    <div style="background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;align-items:flex-end;gap:8px;height:120px">
      ${Object.entries(days).map(([dt, count])=>{
        let hPct = Math.round((count / maxVal) * 100);
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
          <div style="width:100%;background:var(--accent);border-radius:4px 4px 0 0;height:${Math.max(hPct, 4)}%;opacity:${count?1:0.3}" title="${dt}: ${count} эп."></div>
          <div style="font:8px var(--mono);color:var(--muted)">${dt.slice(8)}</div>
        </div>`;
      }).join("")}
    </div>
  `;
}

function renderRatingsTab(){
  const scored = records.filter(x=>!x.deleted).sort((a,b)=>Number(b.score)-Number(a.score));
  if(!scored.length) return '<div class="empty-state"><strong>Нет оценок</strong>Оценивайте просмотренные аниме.</div>';
  return `<div class="anime-list">${scored.map(a=>renderAnimeCardHTML(a)).join("")}</div>`;
}

function renderBadgesTab(){
  const activeRecords = records.filter(x=>!x.deleted);
  const totalAnime = activeRecords.length;
  const totalEp = activeRecords.reduce((s,x)=>s+Number(x.progress||0),0);
  const has10 = activeRecords.some(x=>Number(x.score)===10);
  const notes = activeRecords.filter(x=>x.note&&x.note.trim()).length;

  return `
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">
      ${BADGES.map(b => {
        let cur = 0;
        if(b.id==='first') cur = Math.min(totalAnime,1);
        else if(b.id==='a10') cur = Math.min(totalAnime,10);
        else if(b.id==='a50') cur = Math.min(totalAnime,50);
        else if(b.id==='a100') cur = Math.min(totalAnime,100);
        else if(b.id==='ep100') cur = Math.min(totalEp,100);
        else if(b.id==='ep500') cur = Math.min(totalEp,500);
        else if(b.id==='ep1000') cur = Math.min(totalEp,1000);
        else if(b.id==='top10') cur = has10?1:0;
        else if(b.id==='notes10') cur = Math.min(notes,10);
        const unlocked = cur >= b.max;

        return `
          <div style="background:var(--bg2);border:1px solid ${unlocked?'var(--accent)':'var(--line)'};border-radius:12px;padding:14px;opacity:${unlocked?1:0.5}">
            <div style="font-size:22px;margin-bottom:6px">${b.icon}</div>
            <div style="font:700 12px var(--mono);color:var(--text)">${b.name}</div>
            <div style="font:10px var(--sans);color:var(--muted);margin-top:2px">${b.desc}</div>
            <div style="font:10px var(--mono);color:var(--accent2);margin-top:8px">${cur} / ${b.max}</div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

/* --- EVENT BINDINGS & ACTIONS --- */
function bindModuleEvents(){
  document.getElementById("homeAddBtn")?.addEventListener("click", openNewAnimeModal);
  document.getElementById("bmAddBtn")?.addEventListener("click", openNewAnimeModal);

  document.querySelectorAll(".subtab").forEach(b => {
    b.onclick = () => { activeBookmarkSub = b.dataset.sub; renderModules(); };
  });

  document.getElementById("viewModeToggle")?.addEventListener("click", () => {
    bookmarkViewMode = bookmarkViewMode === 'list' ? 'grid' : 'list';
    renderModules();
  });

  document.getElementById("bookmarkSort")?.addEventListener("change", e => {
    // sorting handled in render
  });

  document.querySelectorAll(".profile-tab").forEach(b => {
    b.onclick = () => {
      document.querySelectorAll(".profile-tab").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      const t = b.dataset.ptab;
      const c = document.getElementById("profileTabContent");
      if(t==='stats') c.innerHTML = `<div class="stats-grid"><div class="stat-box"><div class="stat-num">Дни</div><div class="stat-lbl">ВРЕМЯ</div></div></div>` + renderActivityGraph(records.filter(x=>!x.deleted));
      else if(t==='ratings') c.innerHTML = renderRatingsTab();
      else if(t==='badges') c.innerHTML = renderBadgesTab();
    };
  });

  document.getElementById("editProfileBtn")?.addEventListener("click", openEditProfileModal);
  document.getElementById("exploreSearchInput")?.addEventListener("input", e => {
    clearTimeout(searchTimeout);
    const q = e.target.value.trim();
    if(q.length < 2) return;
    searchTimeout = setTimeout(() => searchExploreAniList(q), 400);
  });
  document.getElementById("randomPlanBtn")?.addEventListener("click", pickRandomPlan);

  document.querySelectorAll("[data-plus1]").forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      incrementProgress(btn.dataset.plus1);
    };
  });

  document.querySelectorAll(".anime-card").forEach(card => {
    card.onclick = () => openDetailModal(card.dataset.id);
  });
}

function incrementProgress(id){
  const a = records.find(x => x.id === id);
  if(!a) return;
  a.progress = (a.progress !== undefined ? a.progress : a.episodes) + 1;
  if(a.progress > a.episodes) a.episodes = a.progress;
  if(a.progress >= a.episodes) a.status = "Просмотрено";
  a.history = a.history || [];
  a.history.push({episode: a.progress, time: Date.now()});
  if(a.history.length > 200) a.history.shift();
  a.updated_at = Date.now();
  saveRecords();
  renderModules();
  notify(`Прогресс: ${a.progress} эп.`);
}

function pickRandomPlan(){
  const plans = records.filter(x => !x.deleted && x.status === "В планах");
  if(!plans.length){ notify("Нет аниме в планах!"); return; }
  const p = plans[Math.floor(Math.random() * plans.length)];
  openDetailModal(p.id);
}

/* Modals Management */
function openNewAnimeModal(){
  editingId = null;
  document.getElementById("modalTitle").textContent = "НОВАЯ ЗАПИСЬ";
  document.getElementById("animeForm").reset();
  document.getElementById("fDate").value = new Date().toISOString().slice(0,10);
  document.getElementById("animeModal").classList.add("open");
}

function openEditAnimeModal(id){
  const a = records.find(x => x.id === id);
  if(!a) return;
  editingId = id;
  document.getElementById("modalTitle").textContent = "РЕДАКТИРОВАНИЕ";
  document.getElementById("fTitle").value = a.title;
  document.getElementById("fStatus").value = a.status;
  document.getElementById("fScore").value = a.score;
  document.getElementById("fProgress").value = a.progress !== undefined ? a.progress : a.episodes;
  document.getElementById("fEpisodes").value = a.episodes;
  document.getElementById("fDate").value = a.date || "";
  document.getElementById("fNote").value = a.note || "";
  document.getElementById("fCover").value = a.cover || "";
  document.getElementById("fAnilistId").value = a.anilistId || "";
  document.getElementById("animeModal").classList.add("open");
}

document.getElementById("modalClose").onclick = () => document.getElementById("animeModal").classList.remove("open");
document.getElementById("cancelForm").onclick = () => document.getElementById("animeModal").classList.remove("open");

document.getElementById("animeForm").onsubmit = (e) => {
  e.preventDefault();
  const title = document.getElementById("fTitle").value.trim();
  const status = document.getElementById("fStatus").value;
  const score = Number(document.getElementById("fScore").value) || 8;
  const progress = Number(document.getElementById("fProgress").value) || 0;
  const episodes = Number(document.getElementById("fEpisodes").value) || 12;
  const date = document.getElementById("fDate").value || null;
  const note = document.getElementById("fNote").value.trim();
  const cover = document.getElementById("fCover").value;
  const anilistId = document.getElementById("fAnilistId").value;
  const now = Date.now();

  if(editingId){
    records = records.map(a => a.id === editingId ? {...a, title, status, score, progress, episodes, date, note, cover, anilistId, updated_at: now} : a);
    notify("Изменения сохранены");
  } else {
    records.push({
      id: uid(), supabaseId: null, title, status, score, progress, episodes, date, note, cover, anilistId,
      favorite: false, genres: [], year: 2026, history: [{episode: progress, time: now}], updated_at: now, deleted: false
    });
    notify("Аниме добавлено");
  }
  saveRecords();
  document.getElementById("animeModal").classList.remove("open");
  renderModules();
};

/* AniList Autocomplete in Form */
const fTitleIn = document.getElementById("fTitle");
const dropdown = document.getElementById("searchDropdown");

fTitleIn?.addEventListener("input", e => {
  clearTimeout(searchTimeout);
  const q = e.target.value.trim();
  if(q.length < 2){ dropdown.style.display = 'none'; return; }
  searchTimeout = setTimeout(() => fetchFormAniList(q), 400);
});

async function fetchFormAniList(query){
  const gql = `query ($search: String) { Page(perPage: 5) { media(search: $search, type: ANIME) { id title { romaji english native } episodes seasonYear coverImage { extraLarge } genres } } }`;
  try {
    const res = await fetch("https://graphql.anilist.co", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({query: gql, variables: {search: query}})
    });
    const json = await res.json();
    const media = json?.data?.Page?.media || [];
    if(!media.length){ dropdown.style.display = 'none'; return; }
    dropdown.innerHTML = media.map(m => {
      const name = m.title.romaji || m.title.english || m.title.native;
      return `<div class="anilist-opt" data-id="${m.id}" data-title="${escapeHTML(name)}" data-eps="${m.episodes||12}" data-cover="${m.coverImage?.extraLarge||''}" data-year="${m.seasonYear||2026}" data-genres='${JSON.stringify(m.genres||[])}' style="padding:10px;display:flex;gap:10px;align-items:center;cursor:pointer;border-bottom:1px solid var(--line)">
        <img src="${m.coverImage?.extraLarge||''}" style="width:30px;height:42px;object-fit:cover;border-radius:4px">
        <div style="font:12px var(--sans)"><b>${escapeHTML(name)}</b><div style="font:10px var(--mono);color:var(--muted)">${m.seasonYear||''} · ${m.episodes||'?'} эп.</div></div>
      </div>`;
    }).join("");
    dropdown.style.display = 'block';
    dropdown.querySelectorAll(".anilist-opt").forEach(opt => {
      opt.onclick = () => {
        document.getElementById("fTitle").value = opt.dataset.title;
        document.getElementById("fEpisodes").value = opt.dataset.eps;
        document.getElementById("fProgress").value = opt.dataset.eps;
        document.getElementById("fCover").value = opt.dataset.cover;
        document.getElementById("fAnilistId").value = opt.dataset.id;
        document.getElementById("fYear").value = opt.dataset.year;
        document.getElementById("fGenres").value = opt.dataset.genres;
        dropdown.style.display = 'none';
      };
    });
  } catch(e){ dropdown.style.display = 'none'; }
}

async function searchExploreAniList(query){
  const gql = `query ($search: String) { Page(perPage: 6) { media(search: $search, type: ANIME) { id title { romaji english native } episodes seasonYear coverImage { extraLarge } description } } }`;
  try {
    const res = await fetch("https://graphql.anilist.co", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({query: gql, variables: {search: query}})
    });
    const json = await res.json();
    const media = json?.data?.Page?.media || [];
    const container = document.getElementById("exploreResults");
    if(!container) return;
    if(!media.length){ container.innerHTML = '<div class="empty-state">Ничего не найдено</div>'; return; }
    container.innerHTML = media.map(m => {
      const name = m.title.romaji || m.title.english || m.title.native;
      return `<div class="anime-card">
        <img class="card-poster" src="${m.coverImage?.extraLarge||''}" alt="">
        <div class="card-body">
          <div class="card-title">${escapeHTML(name)}</div>
          <div class="card-meta"><span>${m.seasonYear||''}</span><span>${m.episodes||'?'} эп.</span></div>
        </div>
        <div><button class="btn primary" onclick="addFromExplore(${m.id}, '${escapeHTML(name)}', ${m.episodes||12}, '${m.coverImage?.extraLarge||''}')">+ В список</button></div>
      </div>`;
    }).join("");
  } catch(e){}
}

function addFromExplore(anilistId, title, episodes, cover){
  records.push({
    id: uid(), supabaseId: null, title, status: "В планах", score: 8, progress: 0, episodes, date: null, note: "", cover, anilistId,
    favorite: false, genres: [], year: 2026, history: [], updated_at: Date.now(), deleted: false
  });
  saveRecords();
  notify(`«${title}» добавлено в планах!`);
}

async function openDetailModal(id){
  const a = records.find(x => x.id === id);
  if(!a) return;
  const content = document.getElementById("detailModalContent");
  content.innerHTML = `
    <div class="modal-top"><h3>${escapeHTML(a.title)}</h3><button class="close-btn" onclick="document.getElementById('detailModal').classList.remove('open')">×</button></div>
    <div style="display:flex;gap:15px;margin-bottom:15px">
      <img src="${escapeHTML(a.cover)}" style="width:100px;height:140px;object-fit:cover;border-radius:8px">
      <div>
        <div style="font:11px var(--mono);color:var(--accent2);margin-bottom:6px">СТАТУС: ${a.status}</div>
        <div style="font:13px var(--mono);margin-bottom:6px">Оценка: ${a.score}/10</div>
        <div style="font:12px var(--sans);color:var(--muted)">Прогресс: ${a.progress} из ${a.episodes} эп.</div>
      </div>
    </div>
    ${a.note ? `<div style="font:12px var(--sans);background:var(--panel);padding:10px;border-radius:8px;margin-bottom:15px"><b>Заметка:</b> ${escapeHTML(a.note)}</div>` : ''}
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" onclick="toggleFavorite('${a.id}')">${a.favorite ? '★ В избранном' : '☆ В избранное'}</button>
      <button class="btn primary" onclick="openEditAnimeModal('${a.id}');document.getElementById('detailModal').classList.remove('open')">Изменить</button>
      <button class="btn" style="color:#f87171" onclick="deleteRecord('${a.id}');document.getElementById('detailModal').classList.remove('open')">Удалить</button>
    </div>
  `;
  document.getElementById("detailModal").classList.add("open");
}

function toggleFavorite(id){
  const a = records.find(x => x.id === id);
  if(!a) return;
  a.favorite = !a.favorite;
  a.updated_at = Date.now();
  saveRecords();
  openDetailModal(id);
  renderModules();
}

function deleteRecord(id){
  const a = records.find(x => x.id === id);
  if(!a) return;
  if(!confirm(`Удалить «${a.title}»?`)) return;
  a.deleted = true;
  a.updated_at = Date.now();
  saveRecords();
  renderModules();
  notify("Запись удалена");
}

/* Settings & Profile Modals */
document.getElementById("settingsBtn").onclick = () => {
  document.getElementById("settingsInner").innerHTML = `
    <div class="settings-section">
      <h4>Управление данными</h4>
      <div class="settings-item"><span>Экспорт резервной копии JSON</span><button class="btn" onclick="exportData()">Экспорт</button></div>
      <div class="settings-item"><span>Импорт резервной копии JSON</span><button class="btn" onclick="document.getElementById('importFile').click()">Импорт</button></div>
      <div class="settings-item"><span>Локальное хранилище</span><span style="font-family:var(--mono)">${(JSON.stringify(records).length/1024).toFixed(1)} КБ</span></div>
    </div>
    <div class="settings-section">
      <h4>Облако Supabase</h4>
      <div class="settings-item"><span>Аккаунт и синхронизация</span><button class="btn primary" onclick="openAuthModal()">Войти / Синхронизация</button></div>
    </div>
    <div class="settings-section">
      <h4>О проекте</h4>
      <div class="settings-item"><span>Версия KairoKit</span><span style="font-family:var(--mono)" id="versionVer">v0.2.0</span></div>
    </div>
  `;
  document.getElementById("settingsModal").classList.add("open");
};

document.getElementById("settingsClose").onclick = () => document.getElementById("settingsModal").classList.remove("open");

function openAuthModal(){
  document.getElementById("settingsModal").classList.remove("open");
  const inner = document.getElementById("authInner");
  if(!supabaseClient){
    inner.innerHTML = `<p style="font:12px var(--mono);color:var(--muted)">Заглушки Supabase не заполнены. Приложение работает локально.</p>`;
  } else if(currentUser){
    inner.innerHTML = `<p style="font:12px var(--mono)">Вы вошли как: <b>${escapeHTML(currentUser.email)}</b></p>
      <div style="display:flex;gap:10px;margin-top:15px"><button class="btn primary" onclick="syncToCloud(true)">Синхронизировать сейчас</button><button class="btn" onclick="logoutSupabase()">Выйти</button></div>`;
  } else {
    inner.innerHTML = `
      <form id="authForm" style="display:grid;gap:12px">
        <div class="field"><label>EMAIL</label><input id="authEmail" type="email" required></div>
        <div class="field"><label>ПАРОЛЬ</label><input id="authPass" type="password" required></div>
        <div style="display:flex;gap:8px"><button type="submit" class="btn primary" name="act" value="login">Войти</button><button type="submit" class="btn" name="act" value="signup">Регистрация</button></div>
      </form>
    `;
    document.getElementById("authForm").onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById("authEmail").value.trim();
      const pass = document.getElementById("authPass").value.trim();
      const act = e.submitter.value;
      try{
        if(act==='signup'){
          const {error} = await supabaseClient.auth.signUp({email, password:pass});
          if(error) throw error;
          notify("Регистрация успешна!");
        } else {
          const {data, error} = await supabaseClient.auth.signInWithPassword({email, password:pass});
          if(error) throw error;
          currentUser = data.user;
          notify("Вход выполнен!");
          document.getElementById("authModal").classList.remove("open");
          syncToCloud(true);
        }
      }catch(err){ alert("Ошибка: " + err.message); }
    };
  }
  document.getElementById("authModal").classList.add("open");
}
document.getElementById("authClose").onclick = () => document.getElementById("authModal").classList.remove("open");

async function logoutSupabase(){
  if(supabaseClient) await supabaseClient.auth.signOut();
  currentUser = null;
  notify("Вы вышли из аккаунта");
  document.getElementById("authModal").classList.remove("open");
}

function openEditProfileModal(){
  document.getElementById("detailModalContent").innerHTML = `
    <div class="modal-top"><h3>РЕДАКТИРОВАТЬ ПРОФИЛЬ</h3><button class="close-btn" onclick="document.getElementById('detailModal').classList.remove('open')">×</button></div>
    <form id="profileForm" style="display:grid;gap:12px">
      <div class="field"><label>НИКНЕЙМ</label><input id="pNick" value="${escapeHTML(profileData.nickname)}" required maxlength="20"></div>
      <div class="field"><label>О СЕБЕ</label><textarea id="pBio" maxlength="120">${escapeHTML(profileData.bio)}</textarea></div>
      <div class="form-actions"><button type="submit" class="btn primary">Сохранить</button></div>
    </form>
  `;
  document.getElementById("detailModal").classList.add("open");
  document.getElementById("profileForm").onsubmit = (e) => {
    e.preventDefault();
    profileData.nickname = document.getElementById("pNick").value.trim();
    profileData.bio = document.getElementById("pBio").value.trim();
    saveProfile();
    document.getElementById("detailModal").classList.remove("open");
    renderModules();
    notify("Профиль обновлен");
  };
}

/* Export / Import */
function exportData(){
  const backup = {app:"KairoKit", version:2, exportedAt:new Date().toISOString(), records, profile:profileData};
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `kairokit-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  notify("Резервная копия скачана");
}

document.getElementById("importFile").onchange = async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  try{
    const json = JSON.parse(await file.text());
    const incoming = Array.isArray(json) ? json : (json.records || []);
    if(!confirm(`Импортировать ${incoming.length} записей?`)) return;
    records = incoming.map(x => ({...x, id: x.id || uid()}));
    if(json.profile) profileData = {...profileData, ...json.profile};
    saveRecords(); saveProfile();
    renderModules();
    notify("Импорт завершен");
  }catch(err){ alert("Ошибка импорта: "+err.message); }
  finally{ e.target.value = ""; }
};

/* Supabase Sync Stub & Queue */
async function syncToCloud(manual=false){
  if(!supabaseClient || !currentUser || syncQueueRunning) return;
  syncQueueRunning = true;
  try{
    const {data: remote, error} = await supabaseClient.from("anime_records").select("*");
    if(error) throw error;
    // Conflict resolution by updated_at
    const remMap = new Map((remote||[]).map(x=>[x.id, x]));
    for(let i=0; i<records.length; i++){
      let loc = records[i];
      if(!loc.supabaseId) loc.supabaseId = loc.id;
      let rem = remMap.get(loc.supabaseId);
      if(!rem){
        await supabaseClient.from("anime_records").insert({
          id: loc.supabaseId, user_id: currentUser.id, title: loc.title, score: loc.score,
          episodes: loc.episodes, progress: loc.progress, status: loc.status, favorite: loc.favorite,
          genres: loc.genres, year: loc.year, date: loc.date || null, note: loc.note, cover: loc.cover,
          anilist_id: loc.anilistId, history: loc.history, updated_at: loc.updated_at, deleted: loc.deleted
        });
      } else {
        if((loc.updated_at||0) > Number(rem.updated_at||0)){
          await supabaseClient.from("anime_records").update({
            title: loc.title, score: loc.score, episodes: loc.episodes, progress: loc.progress,
            status: loc.status, favorite: loc.favorite, genres: loc.genres, year: loc.year,
            date: loc.date || null, note: loc.note, cover: loc.cover, anilist_id: loc.anilistId,
            history: loc.history, updated_at: loc.updated_at, deleted: loc.deleted
          }).eq("id", loc.supabaseId);
        } else if(Number(rem.updated_at||0) > (loc.updated_at||0)){
          records[i] = {
            id: rem.id, supabaseId: rem.id, title: rem.title, score: rem.score, episodes: rem.episodes,
            progress: rem.progress, status: rem.status, favorite: rem.favorite, genres: rem.genres||[],
            year: rem.year||2026, date: rem.date||null, note: rem.note||"", cover: rem.cover||"",
            anilistId: rem.anilist_id||null, history: rem.history||[], updated_at: Number(rem.updated_at), deleted: rem.deleted
          };
        }
        remMap.delete(loc.supabaseId);
      }
    }
    // Clean up deleted markers older than 30 days
    const thirtyDaysAgo = Date.now() - (30 * 86400000);
    records = records.filter(x => !(x.deleted && x.updated_at < thirtyDaysAgo));
    saveRecords();
    if(manual) notify("Синхронизация успешна!");
  }catch(err){
    if(manual) notify("Ошибка синхронизации: " + err.message);
  } finally {
    syncQueueRunning = false;
  }
}

renderModules();
</script>
